name: Renovate

on:
  # Daily so base-image digest refreshes are picked up quickly; renovate.json
  # still restricts npm updates to Mondays.
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      logLevel:
        description: Renovate log level
        type: choice
        default: info
        options: [debug, info, warn]
      dryRun:
        description: Run without opening pull requests
        type: boolean
        default: false

concurrency:
  group: renovate
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Renovate
        uses: renovatebot/github-action@v46.3.6
        with:
          # GITHUB_TOKEN works but its PRs can't trigger other workflows (e.g.
          # publish.yml), so prefer a PAT / GitHub App token when available.
          token: ${{ secrets.RENOVATE_TOKEN || secrets.GITHUB_TOKEN }}
        env:
          RENOVATE_PLATFORM: github
          RENOVATE_AUTODISCOVER: 'false'
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
          # Renovate treats the literal string "null" as "not a dry run"
          RENOVATE_DRY_RUN: ${{ inputs.dryRun && 'full' || 'null' }}
